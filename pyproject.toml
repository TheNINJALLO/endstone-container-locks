[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-container-locks"
version = "1.4.2"
description = "A container locking system for Minecraft Bedrock servers using Endstone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "endstone>=0.11.9,<0.12",
]
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
]

[project.entry-points."endstone"]
container-locks = "endstone_container_locks:ContainerLocksPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_container_locks"]